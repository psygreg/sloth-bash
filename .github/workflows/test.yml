name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          ignore_paths: .github
          severity: error
      - name: Functional tests
        run: bash tests/run.sh
